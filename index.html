const AU = { ctx: null, muted: false, step: 0, nextNote: 0 };
try { AU.muted = localStorage.getItem('krysheb_mute') === '1'; } catch (e) {}
function audioInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  try {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    AU.ctx = new A();
    AU.master = AU.ctx.createGain(); AU.master.gain.value = AU.muted ? 0 : 0.5; AU.master.connect(AU.ctx.destination);
    AU.music = AU.ctx.createGain(); AU.music.gain.value = 0.32; AU.music.connect(AU.master);
    AU.sfx = AU.ctx.createGain(); AU.sfx.gain.value = 0.7; AU.sfx.connect(AU.master);
    const len = AU.ctx.sampleRate * 0.6;
    AU.noise = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate);
    const d = AU.noise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    AU.nextNote = AU.ctx.currentTime + 0.1;
    setInterval(schedMusic, 25);
  } catch (e) { AU.ctx = null; }
}
function toggleMute() {
  AU.muted = !AU.muted;
  try { localStorage.setItem('krysheb_mute', AU.muted ? '1' : '0'); } catch (e) {}
  if (AU.master) AU.master.gain.value = AU.muted ? 0 : 0.5;
}
function toneAt(t, f, dur, type, vol, slide, dest) {
  if (!AU.ctx) return;
  const o = AU.ctx.createOscillator(), g = AU.ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(dest || AU.sfx); o.start(t); o.stop(t + dur + 0.03);
}
function noiseAt(t, dur, vol, freq, dest, type) {
  if (!AU.ctx) return;
  const s = AU.ctx.createBufferSource(); s.buffer = AU.noise;
  const f = AU.ctx.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq;
  const g = AU.ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest || AU.sfx); s.start(t); s.stop(t + dur + 0.03);
}
function tone(f, dur, type = 'square', vol = 0.2, slide = null, when = 0) { if (AU.ctx) toneAt(AU.ctx.currentTime + when, f, dur, type, vol, slide); }
function noise(dur, vol, freq, when = 0, type) { if (AU.ctx) noiseAt(AU.ctx.currentTime + when, dur, vol, freq, AU.sfx, type); }
function sfx(n, a = 0) {
  if (!AU.ctx || AU.muted) return;
  switch (n) {
    case 'jump': tone(280, 0.13, 'square', 0.12, 620); break;
    case 'dbl': tone(520, 0.14, 'square', 0.12, 1100); noise(0.1, 0.08, 3000); break;
    case 'coin': { const k = Math.pow(2, Math.min(a, 12) / 12); tone(988 * k, 0.05, 'square', 0.08); tone(1319 * k, 0.12, 'square', 0.08, null, 0.05); break; }
    case 'gem': tone(1200, 0.08, 'triangle', 0.2); tone(1600, 0.08, 'triangle', 0.2, null, 0.06); tone(2400, 0.2, 'triangle', 0.15, null, 0.12); break;
    case 'power': [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.09, 'square', 0.1, null, i * 0.055)); break;

    case 'hurt': tone(220, 0.22, 'sawtooth', 0.15, 90); break;

    case 'bonk': noise(0.15, 0.4, 300); tone(150, 0.2, 'square', 0.2, 60); break;

const MEL = [69, 0, 72, 0, 76, 0, 72, 74, 72, 0, 69, 0, 65, 0, 69, 72, 67, 0, 72, 0, 76, 0, 79, 76, 74, 0, 71, 0, 67, 0, 74, 0];
const MEL2 = [76, 0, 74, 72, 0, 72, 74, 76, 77, 0, 76, 74, 72, 0, 69, 0, 72, 0, 76, 79, 0, 79, 81, 79, 74, 0, 79, 0, 78, 0, 79, 0];
const BASS = [45, 41, 48, 43];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function schedMusic() {
  if (!AU.ctx) return;
  const sd = 60 / 150 / 2;
  if (AU.nextNote < AU.ctx.currentTime - 0.2) AU.nextNote = AU.ctx.currentTime + 0.05;
  while (AU.nextNote < AU.ctx.currentTime + 0.12) {
    const t = AU.nextNote, s = AU.step % 32, loop = Math.floor(AU.step / 32) % 4;
    if (!AU.muted && mode !== 'pause') {
      const root = BASS[Math.floor(s / 8)];
      toneAt(t, mtof(root + (s % 2 ? 12 : 0)), sd * 0.85, 'triangle', 0.32, null, AU.music);
      const mel = loop === 1 || loop === 3 ? MEL2 : MEL;
      if (mel[s] && mode !== 'over') toneAt(t, mtof(mel[s] + (loop === 3 ? 12 : 0)), sd * 0.8, 'square', 0.055, null, AU.music);
      if (s % 4 === 0) toneAt(t, 150, 0.12, 'sine', 0.5, 40, AU.music);
      if (s % 8 === 4) noiseAt(t, 0.1, 0.18, 1800, AU.music);
      if (s % 2 === 1 || (S && S.ev && S.ev.id === 'disco')) noiseAt(t, 0.03, 0.06, 8000, AU.music, 'highpass');
    }
    AU.nextNote += sd; AU.step++;
  }
}

function coinsLine(x, y, n) { for (let i = 0; i < n; i++) addCoin(x + i * 11, y); }

function genBuilding(first) {
  const diff = clamp(S.dist / 2200, 0, 1);
  const s = S.speedBase;
  const last = S.buildings[S.buildings.length - 1];
  let x, y, w, gap = 0, zip = false;
  if (first) { x = -80; y = 150; w = 520; }
  else {
    const r = Math.random();
    if (r < 0.1) { y = clamp(last.y + rnd(-8, 30), 100, 186); gap = 0; }
    else if (r < 0.19 && last.y < 165 && S.dist > 120) { zip = true; y = clamp(last.y + rnd(25, 48), 110, 192); gap = rnd(150, 220); }
    else {
      y = clamp(last.y + rnd(-32, 40), 100, 186);
      const dy = y - last.y;
      const T = 0.347 + Math.sqrt(2 * Math.max(6, 57 + dy) / 1700);
      const maxGap = s * T * 0.8 - 12;
      gap = clamp(rnd(18, 18 + (maxGap - 18) * (0.4 + 0.6 * diff)), 16, Math.max(18, maxGap));
    }
    x = last.x + last.w + gap;
    w = Math.random() < 0.15 ? rnd(60, 100) : rnd(120, 280);
  }
  y = Math.round(y); x = Math.round(x); w = Math.round(w);
  const b = { x, y, w, id: S.bid++, style: ri(0, STYLES.length - 1) };
  S.buildings.push(b); S.genX = x + w;
  if (zip) {
    const z = { x1: last.x + last.w - 8, y1: last.y - 30, r1: last.y, x2: b.x + 14, y2: b.y - 24, r2: b.y };
    S.zips.push(z);
    for (let i = 1; i < 9; i++) { const u = i / 9; addCoin(lerp(z.x1, z.x2, u), lerp(z.y1, z.y2, u) + 11); }
  } else if (!first && gap > 30 && Math.random() < 0.55) {
    const x0 = last.x + last.w - 6, x1 = b.x + 10;
    const n = Math.max(3, Math.round((x1 - x0) / 14)), hg = Math.min(42, 14 + (x1 - x0) * 0.22);
    for (let i = 0; i <= n; i++) { const u = i / n; addCoin(lerp(x0, x1, u), lerp(last.y, b.y, u) - 10 - Math.sin(u * Math.PI) * hg); }
  }
  if (first) { coinsLine(200, b.y - 8, 6); }
  else populate(b, diff);
  decorate(b);
}

function populate(b, diff) {
  const s = S.speedBase;
  let x = b.x + 58;
  const end = b.x + b.w - 78;
  const minSp = Math.max(55, s * 0.55);
  while (x < end) {
    const r = Math.random(), pObs = 0.28 + 0.45 * diff;
    if (r < pObs) {
      const t = wpick([['crate', 3], ['ac', diff > 0.03 ? 2.5 : 0], ['board', diff > 0.08 ? 2 : 0], ['drone', diff > 0.18 ? 1.7 : 0], ['banana', 0.6], ['tramp', 0.5]]);
      const used = placeObs(t, x, b, end);
      if (used < 0) break;
      x += used + minSp * rnd(1, 1.6);
    } else if (r < pObs + 0.16) { const n = ri(3, 6); if (x + n * 11 < end + 30) coinsLine(x, b.y - 8, n); x += n * 11 + 20; }
    else if (r < pObs + 0.24) {
      if (Math.random() < 0.45) S.cats.push({ x, y: b.y, done: false, vy: 0, oy: 0, a: 1 });
      else { const n = ri(3, 5); for (let i = 0; i < n; i++) S.birds.push({ x: x + i * rnd(5, 9), y: b.y, vx: 0, vy: 0, fly: false, storm: false, f: Math.random() * 6, a: 1 }); }
      x += 50;
    } else x += rnd(30, 60);
  }
  if (Math.random() < 0.2 && S.dist > 30) {
    const type = wpick(Object.keys(PW).map(k => [k, PW[k].w]));
    S.pickups.push({ x: b.x + b.w * rnd(0.35, 0.65), y: b.y - 32, type, got: false, ph: Math.random() * 6 });
  }
  if (Math.random() < 0.1) addCoin(b.x + b.w * rnd(0.2, 0.8), b.y - 40, 'gem');
  if (S.ev && S.ev.id === 'gold') goldRoof(b);
}
function goldRoof(b) {
  for (let cx = b.x + 12; cx < b.x + b.w - 8; cx += 11) { addCoin(cx, b.y - 8); if ((cx | 0) % 3 === 0) addCoin(cx, b.y - 34); }
}
function placeObs(t, x, b, end) {
  switch (t) {
    case 'crate': {
      const st = Math.random() < 0.2 + S.dist / 8000 ? 2 : 1;
      for (let i = 0; i < st; i++) S.crates.push({ x, y: b.y - 9 * (i + 1), w: 9, h: 9, dead: false });
      if (Math.random() < 0.5) addCoin(x + 4, b.y - 9 * st - 14);
      return 9;
    }
    case 'ac': S.solids.push({ x, y: b.y - 12, w: 18, h: 12, dead: false, ph: Math.random() * 6 }); if (Math.random() < 0.6) coinsLine(x + 3, b.y - 20, 2); return 18;
    case 'board': {
      const txt = pick(BOARD_TXT), w = Math.max(30, txt.length * 8 + 6);
      if (x + w > end + 30) return -1;
      S.boards.push({ x, y: b.y - 13 - 22, w, h: 22, base: b.y, txt, col: pick(BOARD_COL), dead: false });
      coinsLine(x + 2, b.y - 5, Math.floor(w / 11));
      return w;
    }
    case 'drone': S.drones.push({ x: x + 30, y0: b.y - 22, y: b.y - 22, w: 12, h: 6, ph: Math.random() * 6, vx: -22, dead: false }); return 40;
    case 'banana': S.bananas.push({ x, y: b.y - 3, w: 6, h: 3, dead: false }); return 6;
    case 'tramp': S.tramps.push({ x, y: b.y - 4, w: 14, h: 4, roof: b.y, t: 0 }); for (let i = 0; i < 4; i++) addCoin(x + 7 + i * 16, b.y - 70 - i * 6); return 14;
  }
  return 10;
}
function decorate(b) {
  const n = ri(0, 2);
  for (let i = 0; i < n; i++) {
    const t = wpick([['antenna', 2], ['tower', 1.2], ['dish', 1], ['vent', 2], ['neon', 1.4], ['plant', 1], ['laundry', 0.9], ['chimney', 1]]);
    const d = { t, x: 0, y: b.y, w: { tower: 16, laundry: 40 }[t] || 8, h: ri(16, 30), seed: Math.random() };
    if (t === 'neon') { d.txt = pick(['БАР', 'КАФЕ', '24/7', 'ПИЦЦА', 'КИНО', 'ОТЕЛЬ', 'DISCO', 'ЛОФТ', 'ЧАЙ']); d.w = d.txt.length * 8 + 6; d.col = pick(['#ff3df5', '#18f0e0', '#ffe14d', '#ff5a5a', '#7dff6a']); }
    if (b.w < d.w + 30) continue;
    d.x = Math.round(b.x + rnd(14, b.w - d.w - 14));
    S.decor.push(d);
  }
}

// ================== ИГРОВАЯ ЛОГИКА ==================
function mult() { return (S.pw.x2 > 0 ? 2 : 1) * (S.ev && (S.ev.id === 'disco' || S.ev.id === 'turbo') ? 2 : 1); }
function comboMul() { return 1 + Math.min(S.combo, 12) * 0.25; }
function txt(x, y, s, c = '#fff', sz = 6) { for (const o of S.texts) if (o.l > o.ml - 0.35 && Math.abs(o.x - x) < 40 && Math.abs(o.y - y) < 7) y = o.y - 8; S.texts.push({ x, y, s, c, l: 1.1, ml: 1.1, sz }); }
function bonus(pts, label, col = '#fff') {
  const v = Math.round(pts * comboMul() * mult());
  S.score += v;
  const p = S.player;
  txt(p.x + p.w / 2, p.y - 6, label + ' +' + v, col);
}
function comboUp() { S.combo++; S.comboT = 4; S.maxCombo = Math.max(S.maxCombo, S.combo); }
function part(x, y, vx, vy, c, l = 0.5, s = 1, g = 300) { if (S.parts.length < 600) S.parts.push({ x, y, vx, vy, c, l, ml: l, s, g }); }
function burst(x, y, n, cols, sp = 80, l = 0.6, s = 1, g = 300) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = rnd(sp * 0.3, sp); part(x, y, Math.cos(a) * v, Math.sin(a) * v, pick(cols), rnd(l * 0.5, l), s, g); } }
function dust(x, y, n = 6) { for (let i = 0; i < n; i++) part(x + rnd(-3, 3), y - 1, rnd(-50, 20), rnd(-40, -5), '#d9d4c7', rnd(0.2, 0.45), 1, 80); }
function shake(v) { S.shake = Math.max(S.shake, v); }
function flash(c, v = 0.5) { S.flash = v; S.flashCol = c; }

function doJump(v, dbl) {
  const p = S.player;
  p.vy = v * (S.pw.giant > 0 ? 1.08 : 1); p.onGround = false; p.coyote = 0; p.buf = 0;
  if (dbl) { sfx('dbl'); burst(p.x + p.w / 2, p.y + p.h, 10, ['#fff', '#cfefff'], 60, 0.4); }
  else { sfx('jump'); dust(p.x + p.w / 2, p.y + p.h, 5); }
}
function startFlip() {
  const p = S.player;
  if (mode !== 'play' || p.dead || p.onGround || p.zip || S.pw.rocket > 0) return;
  if (p.flipping) { if (p.flipQ < 3) p.flipQ++; return; }
  p.flipping = true; p.rot = 0; sfx('flip');
}
function completeFlip() {
  const p = S.player;
  p.flipsAir++; S.flips++; comboUp();
  const names = ['', 'САЛЬТО!', 'ДВОЙНОЕ!', 'ТРОЙНОЕ!!', 'БЕЗУМИЕ!!!'];
  bonus(100 * p.flipsAir, names[Math.min(4, p.flipsAir)], '#ffe14d');
  sfx('trick');
}
function stumble(label) {
  const p = S.player;
  p.speed *= 0.5; p.stumble = 0.45; S.combo = 0;
  txt(p.x + p.w / 2, p.y - 6, label, '#ff6b6b'); sfx('hurt'); shake(2);
}
function land(y, b) {
  const p = S.player, impact = p.vy;
  p.y = y - p.h; p.vy = 0; p.onGround = true; p.jumps = 0;
  if (p.flipping) {
    if (p.rot < 0.7 || p.rot > Math.PI * 2 - 1.0) completeFlip();
    else { stumble('ПРОВАЛ!'); sfx('fail'); }
    p.flipping = false; p.rot = 0; p.flipQ = 0;
  }
  p.flipsAir = 0;
  if (impact > 260) { dust(p.x + p.w / 2, p.y + p.h, S.pw.giant > 0 ? 14 : 6); sfx('land'); if (S.pw.giant > 0) shake(3); }
  if (b && p.lastB && b !== p.lastB && b.x > p.lastB.x + p.lastB.w + 12) {
    if (p.x + p.w - b.x < 16) { comboUp(); bonus(75, 'ИДЕАЛЬНО!', '#7fffd4'); }
  }
  if (b) p.lastB = b;
}
function mantle(b) {
  const p = S.player, depth = p.y + p.h - b.y;
  p.y = b.y - p.h; p.vy = 0; p.onGround = true; p.jumps = 0; p.speed *= 0.9; p.lastB = b;
  if (p.flipping) { p.flipping = false; p.rot = 0; p.flipQ = 0; }
  if (depth > 4) { bonus(25, 'ЗАЦЕП!', '#9fe0ff'); sfx('mantle'); dust(p.x + p.w, b.y, 4); }
}
function useShield() {
  if (S.shield <= 0) return false;
  S.shield--; S.player.inv = 1.3; flash('#4aa8ff', 0.6); sfx('shield'); shake(4);
  const p = S.player; burst(p.x + p.w / 2, p.y + p.h / 2, 24, ['#4aa8ff', '#bfe3ff', '#fff'], 120, 0.6);
  txt(p.x + p.w / 2, p.y - 12, 'ЩИТ СПАС!', '#7fc4ff', 7);
  return true;
}
function bonk(b) {
  const p = S.player;
  if (useShield()) { p.y = b.y - p.h - 1; p.vy = -250; p.onGround = false; p.lastB = b; return; }
  p.bonked = true; p.x = b.x - p.w - 0.1; p.speed = 0; p.vy = Math.max(p.vy, 30);
  p.flipping = false; p.rot = 0;
  S.deathReason = 'Поцеловался со стеной';
  txt(p.x + p.w / 2, p.y - 6, 'БАМ!', '#ff6b6b', 8); shake(5); sfx('bonk');
  burst(b.x, p.y + p.h / 2, 10, ['#fff', '#ffe14d'], 70, 0.4);
}
function hit(reason) {
  const p = S.player;
  if (p.inv > 0 || p.dead) return;
  if (useShield()) return;
  die(reason, true);
}
function die(reason, fly) {
  const p = S.player;
  if (p.dead) return;
  p.dead = true; S.deathReason = reason || S.deathReason; S.deadT = 0;
  p.flipping = false; p.zip = null;
  if (fly) { p.vy = -260; p.dvx = 40; p.drot = 9; } else { p.dvx = 0; p.drot = 3; }
  sfx('death'); shake(7); flash('#ff3030', 0.4);
}
function rescue(byGrace) {
  const p = S.player;
  if (!byGrace) { S.shield--; sfx('shield'); } else sfx('boing');
  let nb = null;
  for (const b of S.buildings) if (b.x > p.x - 2) { nb = b; break; }
  burst(p.x + p.w / 2, H, 16, ['#fff', '#4aa8ff'], 90, 0.5);
  if (nb) p.x = nb.x - p.w - 2;
  p.y = H + 20; p.vy = -800; p.bonked = true; p.rising = true; p.speed = 0; p.inv = 1.2; p.zip = null;
  p.flipping = false; p.rot = 0; S.camSmooth = 0.6;
  txt(p.x + p.w / 2, H - 30, byGrace ? 'МЯГКАЯ ПОСАДКА!' : 'ФУХ! СПАСЁН', '#7fc4ff', 7);
}
function activate(type) {
  const p = S.player;
  if (type === 'shield') S.shield = Math.min(2, S.shield + 1);
  else S.pw[type] = PW[type].dur;
  if (type === 'rocket') { p.zip = null; p.flipping = false; p.rot = 0; p.bonked = false; }
  if (type === 'giant') shake(4);
  txt(p.x + p.w / 2, p.y - 14, PW[type].name + '!', PW[type].col, 7);
  sfx('power'); flash(PW[type].col, 0.35);
  burst(p.x + p.w / 2, p.y + p.h / 2, 20, [PW[type].col, '#fff'], 100, 0.6);
}
function onPwEnd(k) {
  if (k === 'jet' || k === 'rocket') S.grace = 2.2;
  const p = S.player;
  if (k === 'giant') { txt(p.x + p.w / 2, p.y - 8, 'УМЕНЬШИЛСЯ', '#aaa'); }
}
function zipY(z, x) { return lerp(z.y1, z.y2, clamp((x - z.x1) / (z.x2 - z.x1), 0, 1)); }

function updPlayer(dt) {
  const p = S.player;
  if (p.dead) { p.vy += 900 * dt; p.y += p.vy * dt; p.x += p.dvx * dt; p.rot += p.drot * dt; return; }
  if (p.inv > 0) p.inv -= dt;
  if (p.stumble > 0) p.stumble -= dt;
  if (p.slip > 0) p.slip -= dt;
  if (p.zipCd > 0) p.zipCd -= dt;
  const sc = S.pw.giant > 0 ? 2 : 1;
  p.sliding = p.onGround && !p.zip && S.pw.rocket <= 0 && (input.down || p.slip > 0);
  if (p.sliding && !p.wasSliding) { sfx('slide'); dust(p.x + p.w / 2, p.y + p.h, 5); }
  p.wasSliding = p.sliding;
  const bottom = p.y + p.h;
  p.w = 8 * sc; p.h = (p.sliding ? 8 : 15) * sc; p.y = bottom - p.h;

  let tgt = S.speedBase * (S.ev && S.ev.id === 'turbo' ? 1.35 : 1);
  if (S.pw.rocket > 0) tgt *= 2.3;
  if (p.zip) tgt *= 1.25;
  if (p.rising && p.vy > -60) { p.rising = false; p.bonked = false; p.speed = tgt * 0.85; }
  if (!p.bonked) p.speed += (tgt - p.speed) * Math.min(1, dt * (p.speed < tgt ? 1.2 : 3));
  if (p.buf > 0) p.buf -= dt;
  if (p.onGround) p.coyote = 0.1; else p.coyote -= dt;
  p.anim += dt * p.speed / 12;

  // --- РАКЕТА ---
  if (S.pw.rocket > 0) {
    let minY = 999;
    for (const b of S.buildings) if (b.x < p.x + 260 && b.x + b.w > p.x - 20) minY = Math.min(minY, b.y);
    if (minY === 999) minY = 140;
    p.vy = (minY - 62 - p.h - p.y) * 5; p.y += p.vy * dt; p.x += p.speed * dt;
    p.onGround = false; p.rot = 0; p.flipping = false; p.bonked = false; p.rising = false;
    part(p.x - 2, p.y + p.h / 2 + rnd(-2, 2), -rnd(60, 140), rnd(-20, 20), pick(['#ff3d7f', '#ffb13d', '#fff']), 0.35, 2, 0);
    interact(dt, p.y + p.h); return;
  }
  // --- ЗИПЛАЙН ---
  if (p.zip) {
    const z = p.zip; p.x += p.speed * dt;
    const cxp = p.x + p.w / 2;
    p.y = zipY(z, cxp) - 1; p.vy = 0; p.rot = 0;
    if (Math.random() < 0.6) part(cxp, p.y, rnd(-60, -20), rnd(-30, 10), pick(['#ffe14d', '#fff']), 0.25, 1, 200);
    if (p.buf > 0) { p.buf = 0; p.zip = null; p.vy = -320; p.jumps = 0; p.zipCd = 0.3; sfx('jump'); }
    else if (cxp >= z.x2) { p.zip = null; p.vy = -140; p.zipCd = 0.3; }
    interact(dt, p.y + p.h); return;
  }
  // --- ПРЫЖКИ ---
  if (p.buf > 0 && !p.bonked) {
    if (p.onGround || p.coyote > 0) doJump(-335);
    else if (S.pw.jet <= 0 && S.pw.wings > 0 && p.jumps < 1) { p.jumps++; doJump(-310, true); }
  }
  const moon = S.ev && S.ev.id === 'moon' ? 0.45 : 1;
  let gr;
  if (S.pw.jet > 0) {
    gr = 650;
    if (input.jump) {
      p.vy -= 1500 * dt;
      part(p.x + 1, p.y + p.h - 3, rnd(-20, 0), rnd(60, 120), pick(['#ff8a3a', '#ffd23a', '#fff']), 0.3, 1, 0);
    }
  } else gr = (p.vy < 0 && input.jump) ? 950 : 1700;
  p.vy += gr * moon * dt;
  if (!p.onGround && input.down && S.pw.jet <= 0) p.vy += 1500 * dt;
  if (S.pw.jet > 0) p.vy = clamp(p.vy, -240, 150);
  else { const mf = input.down ? 720 : (moon < 1 ? 300 : 520); if (p.vy > mf) p.vy = mf; }

  const prevX = p.x, prevB = p.y + p.h;
  p.x += p.speed * dt;
  p.onGround = false;
  let snapped = false;
  for (const b of S.buildings) {
    if (prevX + p.w <= b.x + 0.001 && p.x + p.w > b.x && p.y + p.h > b.y + 0.5) {
      if (p.y + p.h - b.y <= 13 * sc && !p.bonked) { mantle(b); snapped = true; }
      else if (!p.bonked) bonk(b);
      else p.x = b.x - p.w - 0.1;
      break;
    }
  }
  if (!snapped) for (const s of S.solids) {
    if (s.dead) continue;
    if (prevX + p.w <= s.x + 0.001 && p.x + p.w > s.x && p.y + p.h > s.y + 0.5 && p.y < s.y + s.h) {
      if (sc > 1) { smashSolid(s); }
      else if (p.y + p.h - s.y <= 5) { p.y = s.y - p.h; p.vy = 0; p.onGround = true; snapped = true; }
      else if (p.inv > 0) {}
      else { hit('Кондиционер не прощает'); if (p.dead) return; }
    }
  }
  if (!snapped) {
    p.y += p.vy * dt;
    if (p.y < -280) { p.y = -280; p.vy = Math.max(0, p.vy); }
    const bot = p.y + p.h;
    if (p.vy >= 0) {
      for (const b of S.buildings) {
        if (p.x + p.w > b.x + 0.5 && p.x < b.x + b.w && prevB <= b.y + 0.5 && bot >= b.y) { land(b.y, b); break; }
      }
      if (!p.onGround) for (const s of S.solids) {
        if (!s.dead && p.x + p.w > s.x && p.x < s.x + s.w && prevB <= s.y + 0.5 && bot >= s.y) { land(s.y, null); break; }
      }
    }
  }
  // сальто
  if (p.flipping) {
    p.rot += dt * Math.PI * 2 / 0.42;
    if (p.rot >= Math.PI * 2) {
      p.rot -= Math.PI * 2; completeFlip();
      if (p.flipQ > 0) { p.flipQ--; sfx('flip'); } else { p.flipping = false; p.rot = 0; }
    }
  }
  // зиплайн
  if (!p.onGround && !(p.zipCd > 0) && !p.bonked) {
    for (const z of S.zips) {
      const cxp = p.x + p.w / 2;
      if (cxp >= z.x1 && cxp <= z.x2 - 12) {
        const ly = zipY(z, cxp);
        if (ly >= p.y - 4 && ly <= p.y + 9) {
          p.zip = z; p.flipping = false; p.rot = 0; p.flipQ = 0; p.jumps = 0;
          sfx('zip'); bonus(50, 'ЗИПЛАЙН!', '#ffe14d'); break;
        }
      }
    }
  }
  interact(dt, prevB);
  // падение
  if (p.y > H + 25 && !p.dead) {
    if (S.grace > 0) rescue(true);
    else if (S.shield > 0) rescue(false);
    else { if (!p.bonked) S.deathReason = 'Не долетел до крыши'; die(S.deathReason, false); }
  }
}

function smashSolid(s) { s.dead = true; burst(s.x + s.w / 2, s.y + s.h / 2, 18, ['#c9d1da', '#8a96a3', '#ffffff'], 140, 0.7, 2); bonus(40, 'БАХ!', '#5fe36b'); sfx('crate'); shake(3); }

function updEvent(dt) {

    if (id === 'pizza') { S.pizzaT -= dt; if (S.pizzaT <= 0) { S.pizzaT = 0.22; addCoin(S.camX + rnd(110, W + 80), S.camY - 10, 'pizza', true); } }

function update(dt) {
  S.t += dt;
  S.cyc = (S.cyc + dt / 110) % 1;
  const p = S.player;
  for (const k in S.pw) if (k !== 'slow' && S.pw[k] > 0) { S.pw[k] -= dt; if (S.pw[k] <= 0) { S.pw[k] = 0; onPwEnd(k); } }
  if (S.grace > 0) S.grace -= dt;
  if (S.kurT > 0) S.kurT -= dt;
  if (S.coinStreakT > 0) { S.coinStreakT -= dt; if (S.coinStreakT <= 0) S.coinStreak = 0; }
  if (S.combo > 0) { S.comboT -= dt; if (S.comboT <= 0) S.combo = 0; }
  S.speedBase = Math.min(310, 130 + S.dist * 0.13);
  if (!p.dead) updEvent(dt);
  updPlayer(dt);
  if (!p.dead) {
    const d = (p.x - 40) / 10;
    if (d > S.dist) { S.score += (d - S.dist) * mult(); S.dist = d; }
    const tx = p.x - 110;
    if (S.camSmooth > 0) { S.camSmooth -= dt; S.camX += (tx - S.camX) * Math.min(1, dt * 8); } else S.camX = tx;
    const ty = Math.min(0, p.y - 45);
    S.camY += (ty - S.camY) * Math.min(1, dt * 6);
  } else {
    S.deadT += dt;
    if (S.deadT > 1.3 || (p.y > H + 120 && S.deadT > 0.6)) gameOver();
  }
  while (S.genX < S.camX + W + 350) genBuilding(false);
  updWorld(dt);
}

function updWorld(dt) {
  for (const d of S.drones) { if (d.dead) continue; d.ph += dt * 3; d.x += d.vx * dt; d.y = d.y0 + Math.sin(d.ph) * 8; }
  for (const t of S.tramps) if (t.t > 0) t.t -= dt;
  for (const c of S.cats) if (c.done) { c.vy += 500 * dt; c.oy += c.vy * dt; c.a -= dt * 0.8; }
  for (const b of S.birds) if (b.fly) { b.x += b.vx * dt; b.y += b.vy * dt; if (!b.storm) b.vy -= 40 * dt; b.f += dt * 18; if (!b.storm) b.a -= dt * 0.4; }
  for (const c of S.coins) if (c.fall && !c.got) { c.vy = Math.min(90, c.vy + 40 * dt); c.y += c.vy * dt; if (c.kind === 'pizza') c.x += Math.sin(S.t * 3 + c.sw) * 14 * dt; }

  for (const t of S.texts) { t.l -= dt; t.y -= 22 * dt; }

  if (S.banner) { S.banner.l -= dt; if (S.banner.l <= 0) S.banner = null; }

  const L = S.camX - 90;
  const keep = o => o.x + (o.w || 0) > L;
  S.buildings = S.buildings.filter(keep);
  S.solids = S.solids.filter(o => keep(o) && !o.dead);
  S.crates = S.crates.filter(o => keep(o) && !o.dead);
  S.boards = S.boards.filter(o => keep(o) && !o.dead);
  S.drones = S.drones.filter(o => keep(o) && !o.dead);
  S.bananas = S.bananas.filter(o => keep(o) && !o.dead);
  S.tramps = S.tramps.filter(keep);
  S.cats = S.cats.filter(o => keep(o) && o.a > 0);
  S.birds = S.birds.filter(o => o.x > L - 40 && o.a > 0 && o.y > S.camY - 120);
  S.coins = S.coins.filter(o => !o.got && o.x > L && o.y < H + 30);
  S.pickups = S.pickups.filter(o => !o.got && o.x > L);
  S.zips = S.zips.filter(o => o.x2 > L);
  S.decor = S.decor.filter(o => o.x + o.w > L);
  S.parts = S.parts.filter(o => o.l > 0);
  S.texts = S.texts.filter(o => o.l > 0);

const PALS = {
  day: { top: [66, 140, 230], bot: [168, 214, 246], far: [140, 172, 206], mid: [104, 128, 170], cloud: [255, 255, 255], lit: 1, night: 0 },
  sunset: { top: [70, 52, 130], bot: [255, 150, 92], far: [150, 92, 120], mid: [96, 58, 92], cloud: [255, 190, 160], lit: 0.8, night: 0.35 },
  night: { top: [8, 10, 30], bot: [38, 30, 78], far: [34, 34, 72], mid: [22, 22, 50], cloud: [70, 70, 110], lit: 0.45, night: 1 },
  dawn: { top: [96, 112, 196], bot: [255, 196, 160], far: [156, 138, 168], mid: [106, 96, 138], cloud: [255, 222, 222], lit: 0.82, night: 0.3 },
};
const PKEYS = [[0, 'day'], [0.4, 'day'], [0.5, 'sunset'], [0.58, 'night'], [0.86, 'night'], [0.94, 'dawn'], [1, 'day']];
let P = null;
function palette() {
  const c = S.cyc; let i = 0;
  while (i < PKEYS.length - 2 && c > PKEYS[i + 1][0]) i++;
  const a = PKEYS[i], b = PKEYS[i + 1], t = clamp((c - a[0]) / ((b[0] - a[0]) || 1), 0, 1);
  const A = PALS[a[1]], B = PALS[b[1]], o = {};
  for (const k in A) o[k] = Array.isArray(A[k]) ? mix(A[k], B[k], t) : lerp(A[k], B[k], t);
  o.disco = !!(S.ev && S.ev.id === 'disco');
  if (o.disco) {
    o.top = hsv((S.t * 0.15) % 1, 0.8, 0.45); o.bot = hsv((S.t * 0.15 + 0.35) % 1, 0.7, 0.85);
    o.night = Math.max(o.night, 0.75); o.lit = Math.min(o.lit, 0.6);
  }
  return o;
}
function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function pcirc(x, y, r, c) { ctx.fillStyle = c; x = Math.round(x); y = Math.round(y); for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy) + 0.5); ctx.fillRect(x - w, y + dy, w * 2 + 1, 1); } }
function pring(x, y, r, c) { ctx.fillStyle = c; x = Math.round(x); y = Math.round(y); const n = Math.max(8, r * 7); for (let a = 0; a < n; a++) { const an = a / n * Math.PI * 2; ctx.fillRect(x + Math.round(Math.cos(an) * r), y + Math.round(Math.sin(an) * r), 1, 1); } }
function pline(x0, y0, x1, y1, c) { ctx.fillStyle = c; const dx = x1 - x0, dy = y1 - y0, n = Math.max(1, Math.max(Math.abs(dx), Math.abs(dy)) | 0); for (let i = 0; i <= n; i++) ctx.fillRect(Math.round(x0 + dx * i / n), Math.round(y0 + dy * i / n), 1, 1); }
function wtext(s, x, y, c) { ctx.font = '8px ' + FONT; ctx.textBaseline = 'top'; ctx.textAlign = 'left'; ctx.fillStyle = c; ctx.fillText(s, Math.round(x), Math.round(y)); }

function drawSky() {
  const N = 18;
  for (let i = 0; i < N; i++) { const t = i / (N - 1); R(0, Math.floor(i * H / N), W, Math.ceil(H / N) + 1, rgb(mix(P.top, P.bot, t * t))); }
  if (P.night > 0.25) {
    for (const s of STARS) {

      ctx.globalAlpha = clamp((P.night - 0.25) * 1.4, 0, 1) * (0.4 + 0.6 * tw * s.b);

    }

  }
  const c = S.cyc;
  if (c < 0.56) { const u = (c + 0.08) / 0.64; const x = lerp(-20, W + 20, u), y = 150 - Math.sin(u * Math.PI) * 125; ctx.globalAlpha = 0.25; pcirc(x, y, 15, '#fff2c0'); ctx.globalAlpha = 1; pcirc(x, y, 10, P.disco ? rgb(hsv(S.t % 1, 0.6, 1)) : '#ffe9a0'); pcirc(x - 2, y - 2, 5, '#fff8d8'); }

  }

}
function drawLayers() {
  for (const L of S.layers) {
    const off = S.camX * L.f;
    while (L.nx < off + W + 60) {
      const w = L.kind ? ri(26, 60) : ri(18, 48), h = L.kind ? ri(40, 105) : ri(55, 125);
      L.items.push({ x: L.nx, w, h, id: Math.floor(Math.random() * 1e9), ant: Math.random() < 0.3 });
      L.nx += w + (L.kind ? ri(3, 16) : ri(0, 6));

function drawBuilding(b) {
  const sx = Math.round(b.x - S.camX), sy = Math.round(b.y - S.camY);
  if (sx > W || sx + b.w < 0 || sy > H) return;
  const st = STYLES[b.style], lit = P.lit;
  const base = mix(st.c, P.far, 0.12);
  R(sx, sy, b.w, H - sy, rgb(base, lit));
  R(sx, sy, 2, H - sy, rgb(base, lit * 0.78));
  R(sx + b.w - 1, sy, 1, H - sy, rgb(base, lit * 0.85));
  // окна
  const cw = st.ww + st.gx, nC = Math.floor((b.w - 2 * st.mx + st.gx) / cw);
  const x0 = sx + Math.floor((b.w - (nC * cw - st.gx)) / 2);
  const unlit = st.glass ? mix([60, 90, 130], P.bot, 0.5 * (1 - P.night)) : mix([40, 48, 66], P.bot, 0.3 * (1 - P.night));
  const litCh = 0.12 + 0.45 * P.night;
  for (let j = 0, wy = sy + 10; wy < H; j++, wy += st.wh + st.gy) {
    for (let i = 0; i < nC; i++) {
      const wx = x0 + i * cw;
      if (wx > W || wx + st.ww < 0) continue;
      const hv = hash(b.id, i, j);
      let c;
      if (hv < litCh) c = P.disco ? rgb(hsv((hash(b.id, j, i) + S.t * 0.5) % 1, 0.7, 1)) : (hv < litCh * 0.25 ? '#bfe3ff' : '#ffd678');

function drawDecor(d) {

    } else {
      T('ПРОБЕЛ — ПРЫЖОК (держи — выше)', W / 2, 104, 5, '#fff', 'center');
      T('↓ — ПОДКАТ    X — САЛЬТО В ВОЗДУХЕ', W / 2, 114, 5, '#fff', 'center');
    }
    dc.globalAlpha = 1;
  }
  if (isTouch && mode === 'play') {
    dc.globalAlpha = 0.25;
    T('ПОДКАТ', W * 0.15, H - 12, 6, '#fff', 'center'); T('САЛЬТО', W * 0.5, H - 12, 6, '#fff', 'center'); T('ПРЫЖОК', W * 0.85, H - 12, 6, '#fff', 'center');
    T('II', W - 8, 42, 7, '#fff', 'right');
    dc.globalAlpha = 1;
  }
}
function drawMenu() {
  BOX(0, 0, W, H, 'rgba(10,8,30,0.45)');
  const bob = Math.sin(performance.now() / 400) * 2;
  const title = 'КРЫШЕБЕГ';
  for (let i = 0; i < title.length; i++) {
    const ch = title[i], x = W / 2 - (title.length * 16) / 2 + i * 16 + 8;
    const yy = 22 + Math.sin(performance.now() / 300 + i * 0.6) * 3;
    T(ch, x, yy, 16, rgb(hsv((i / title.length + performance.now() / 4000) % 1, 0.6, 1)), 'center');
  }
  T('БЕСКОНЕЧНЫЙ ПАРКУР ПО КРЫШАМ', W / 2, 44, 5, '#cfe7ff', 'center');
  // персонаж
  const sk = SKINS[menuSel], owned = save.skins.includes(menuSel);
  const spr = SKIN_SPR[menuSel]['run' + (Math.floor(performance.now() / 90) % 4)];
  BOX(W / 2 - 34, 58, 68, 66, 'rgba(0,0,0,0.35)');
  if (!owned) dc.globalAlpha = 0.45;
  IMG(spr, W / 2 - 18, 62 + bob, 3);
  dc.globalAlpha = 1;
  T('<', W / 2 - 52, 84, 10, '#fff', 'center'); T('>', W / 2 + 52, 84, 10, '#fff', 'center');
  T(sk.name, W / 2, 128, 7, '#fff', 'center');
  if (owned) T(save.skin === menuSel ? 'ВЫБРАН' : 'ЕСТЬ', W / 2, 139, 5, '#7fffd4', 'center');
  else { IMG(COIN_IC, W / 2 - 22, 138, 1); T(String(sk.price), W / 2 - 13, 139, 5, save.coins >= sk.price ? '#ffd23a' : '#ff6b6b'); }
  const blink = Math.floor(performance.now() / 500) % 2;
  if (blink) T(owned ? (isTouch ? 'ТАП — СТАРТ' : 'ПРОБЕЛ — СТАРТ') : (isTouch ? 'ТАП — КУПИТЬ' : 'ПРОБЕЛ — КУПИТЬ'), W / 2, 154, 8, '#ffe14d', 'center');
  if (menuMsgT > 0) T(menuMsg, W / 2, 168, 5, '#ff9a9a', 'center');
  IMG(COIN_IC, 8, 8, 1); T(String(save.coins), 17, 8, 6, '#ffd23a');
  T('РЕКОРД ' + save.best, W - 8, 8, 6, '#fff', 'right');
  T(isTouch ? '' : '↑/ПРОБЕЛ прыжок  ↓ подкат  X сальто  ←→ скин', W / 2, 184, 4.5, '#ffffffb0', 'center');
  T('P пауза  M звук' + (AU.muted ? ' (выкл)' : ''), W / 2, 194, 4.5, '#ffffffb0', 'center');
  T('усилители • дроны • зиплайны • НЛО • коты', W / 2, 205, 4.5, '#ffffff70', 'center');
}
function drawOver() {
  const a = clamp(S.overT * 3, 0, 1);
  dc.globalAlpha = a;
  BOX(0, 0, W, H, 'rgba(8,6,24,0.7)');
  T('КОНЕЦ ЗАБЕГА', W / 2, 22, 12, '#ff6b6b', 'center');
  T(S.deathReason, W / 2, 40, 5, '#ffb0b0', 'center');
  T(String(S.score), W / 2, 56, 16, '#fff', 'center');
  if (S.newBest && Math.floor(performance.now() / 300) % 2) T('НОВЫЙ РЕКОРД!', W / 2, 78, 8, '#ffe14d', 'center');
  const L = [['ДИСТАНЦИЯ', Math.floor(S.dist) + ' м'], ['МОНЕТЫ', '+' + S.coinsGot], ['САЛЬТО', String(S.flips)], ['МАКС. КОМБО', String(S.maxCombo)], ['ДРОНЫ СБИТЫ', String(S.drones_k)], ['РЕКОРД', String(save.best)]];
  L.forEach((r, i) => { T(r[0], W / 2 - 80, 96 + i * 12, 6, '#cfe7ff'); T(r[1], W / 2 + 80, 96 + i * 12, 6, '#fff', 'right'); });
  if (S.overT > 0.8 && Math.floor(performance.now() / 500) % 2) T(isTouch ? 'ТАП — ЕЩЁ РАЗ' : 'ПРОБЕЛ — ЕЩЁ РАЗ', W / 2, 172, 8, '#ffe14d', 'center');
  T(isTouch ? 'тап вверху — меню' : 'ESC — МЕНЮ', W / 2, 190, 5, '#ffffffa0', 'center');
  dc.globalAlpha = 1;
}

// ================== ВВОД ==================
function jumpPress() {
  audioInit();
  if (mode === 'play') { S.player.buf = 0.13; input.jump = true; }
  else if (mode === 'menu') menuConfirm();
  else if (mode === 'over' && S.overT > 0.8) startGame();
  else if (mode === 'pause') mode = 'play';
}
function menuConfirm() {
  if (save.skins.includes(menuSel)) { save.skin = menuSel; persist(); startGame(); }
  else if (save.coins >= SKINS[menuSel].price) {
    save.coins -= SKINS[menuSel].price; save.skins.push(menuSel); save.skin = menuSel; persist(); sfx('buy');
    menuMsg = 'КУПЛЕНО!'; menuMsgT = 1.5;
  } else { sfx('nope'); menuMsg = 'НЕ ХВАТАЕТ МОНЕТ — БЕГАЙ И СОБИРАЙ!'; menuMsgT = 2; }
}
function menuMove(d) { menuSel = (menuSel + d + SKINS.length) % SKINS.length; if (save.skins.includes(menuSel)) save.skin = menuSel; sfx('ui'); }
function togglePause() { if (mode === 'play') mode = 'pause'; else if (mode === 'pause') mode = 'play'; }

const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW', 'KeyZ'], DOWN_KEYS = ['ArrowDown', 'KeyS'], TRICK_KEYS = ['KeyX', 'KeyF', 'ShiftLeft', 'ShiftRight', 'KeyJ'];
addEventListener('keydown', e => {
  const c = e.code;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(c)) e.preventDefault();
  if (e.repeat) return;
  audioInit();
  if (c === 'KeyM') { toggleMute(); return; }
  if (mode === 'menu') {
    if (c === 'ArrowLeft' || c === 'KeyA') menuMove(-1);
    else if (c === 'ArrowRight' || c === 'KeyD') menuMove(1);
    else if (JUMP_KEYS.includes(c) || c === 'Enter') menuConfirm();
    return;
  }
  if (c === 'KeyP' || (c === 'Escape' && mode !== 'over')) { togglePause(); return; }
  if (mode === 'over') {
    if (c === 'Escape') { mode = 'menu'; newWorld(); return; }
    if (JUMP_KEYS.includes(c) || c === 'Enter') jumpPress();
    return;
  }
  if (JUMP_KEYS.includes(c)) jumpPress();
  else if (DOWN_KEYS.includes(c)) input.down = true;
  else if (TRICK_KEYS.includes(c) || c === 'ArrowRight') startFlip();
});
addEventListener('keyup', e => {
  if (JUMP_KEYS.includes(e.code)) input.jump = false;
  if (DOWN_KEYS.includes(e.code)) input.down = false;
});
const ptrs = new Map();
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit();
  const touch = e.pointerType !== 'mouse';
  if (touch) isTouch = true;
  const gx = (e.clientX * (cv.width / innerWidth) - offX) / scale, gy = (e.clientY * (cv.height / innerHeight) - offY) / scale;
  if (mode === 'menu') {
    if (gx < W * 0.35) menuMove(-1); else if (gx > W * 0.65) menuMove(1); else menuConfirm();
    return;
  }
  if (mode === 'over') { if (S.overT > 0.8) { if (touch && gy < H * 0.2) { mode = 'menu'; newWorld(); } else startGame(); } return; }
  if (mode === 'pause') { mode = 'play'; return; }
  if (touch && gx > W * 0.88 && gy < H * 0.28 && gy > H * 0.12) { togglePause(); return; }
  let zone;
  if (!touch) zone = e.button === 2 ? 'trick' : 'jump';
  else zone = gx < W * 0.3 ? 'down' : gx > W * 0.6 ? 'jump' : 'trick';
  ptrs.set(e.pointerId, zone);
  if (zone === 'jump') jumpPress();
  else if (zone === 'down') input.down = true;
  else startFlip();
});
function ptrUp(e) {
  const z = ptrs.get(e.pointerId); ptrs.delete(e.pointerId);
  const still = v => [...ptrs.values()].includes(v);
  if (z === 'jump' && !still('jump')) input.jump = false;
  if (z === 'down' && !still('down')) input.down = false;
}
cv.addEventListener('pointerup', ptrUp); cv.addEventListener('pointercancel', ptrUp);
addEventListener('blur', () => { if (mode === 'play') mode = 'pause'; input.jump = input.down = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') mode = 'pause'; });

// ================== ЦИКЛ ==================
newWorld();
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode === 'play') {
    const ts = S.pw.slow > 0 ? 0.55 : 1;
    if (S.pw.slow > 0) { S.pw.slow -= dt; if (S.pw.slow <= 0) S.pw.slow = 0; }
    acc += dt * ts;
    let n = 0;
    while (acc >= STEP && n < 12) { update(STEP); acc -= STEP; n++; if (mode !== 'play') break; }
    if (n >= 12) acc = 0;
  } else if (mode === 'menu') {
    S.t += dt; S.cyc = (S.cyc + dt / 60) % 1; S.camX += 55 * dt;
    while (S.genX < S.camX + W + 350) genBuilding(false);
    if (menuMsgT > 0) menuMsgT -= dt;
    updWorld(dt);
  } else if (mode === 'over') {
    S.overT += dt; S.t += dt;
    for (const q of S.parts) { q.l -= dt; q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt; }
    S.parts = S.parts.filter(o => o.l > 0);
  }
  renderWorld(mode === 'pause' ? 0 : dt);
  dc.imageSmoothingEnabled = false;
  dc.fillStyle = '#000'; dc.fillRect(0, 0, cv.width, cv.height);
  dc.drawImage(buf, offX, offY, W * scale, H * scale);
  if (mode === 'menu') drawMenu();
  else {
    drawHUD();
    if (mode === 'over') drawOver();
    if (mode === 'pause') { BOX(0, 0, W, H, 'rgba(0,0,0,0.5)'); T('ПАУЗА', W / 2, 90, 14, '#fff', 'center'); T(isTouch ? 'тап — продолжить' : 'P — продолжить', W / 2, 112, 6, '#cfe7ff', 'center'); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
